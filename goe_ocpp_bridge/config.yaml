name: go-e v1_v2 OCPP Bridge
version: "0.1.1"
slug: goe_ocpp_bridge
description: Lokale go-eCharger HTTP API als OCPP 1.6 JSON Charge Point bereitstellen
url: https://github.com/nvormund/go-e_v1_v2_OCPP_bridge_ha_addon
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: manual
init: false
stage: experimental

options:
  goe_host: "192.168.178.50"
  goe_api_version: "auto"
  goe_timeout_seconds: 5
  goe_poll_interval_seconds: 30
  ocpp_version: "1.6"
  ocpp_backend_url: "wss://example.com/ocpp/goe-test-001"
  ocpp_charge_point_id: "goe-test-001"
  ocpp_connector_id: 1
  ocpp_basic_auth_user: ""
  ocpp_basic_auth_password: ""
  bridge_dry_run: true
  bridge_read_only: true
  bridge_allow_remote_start: false
  bridge_allow_remote_stop: true
  bridge_heartbeat_interval_seconds: 30
  bridge_meter_interval_seconds: 30
  bridge_reconnect_interval_seconds: 10
  bridge_websocket_ping_interval_seconds: 15
  bridge_websocket_ping_timeout_seconds: 20
  bridge_log_level: "DEBUG"
  bridge_state_file: "/data/state.json"
  bridge_log_file: ""

schema:
  goe_host: "str(1,)"
  goe_api_version: "list(auto|v1|v2)"
  goe_timeout_seconds: "int(1,60)"
  goe_poll_interval_seconds: "int(1,3600)"
  ocpp_version: "list(1.6)"
  ocpp_backend_url: "str(1,)"
  ocpp_charge_point_id: "str(1,)"
  ocpp_connector_id: "int(1,99)"
  ocpp_basic_auth_user: "str?"
  ocpp_basic_auth_password: "password?"
  bridge_dry_run: bool
  bridge_read_only: bool
  bridge_allow_remote_start: bool
  bridge_allow_remote_stop: bool
  bridge_heartbeat_interval_seconds: "int(5,3600)"
  bridge_meter_interval_seconds: "int(5,3600)"
  bridge_reconnect_interval_seconds: "int(1,600)"
  bridge_websocket_ping_interval_seconds: "int(5,600)"
  bridge_websocket_ping_timeout_seconds: "int(5,600)"
  bridge_log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  bridge_state_file: "str(1,)"
  bridge_log_file: "str?"
