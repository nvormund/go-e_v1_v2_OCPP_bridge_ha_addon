configuration:
  goe_host:
    name: go-e wallbox - IP address or hostname
    description: Local address of the go-e wallbox, for example 192.168.188.95.
  goe_api_version:
    name: go-e wallbox - API version
    description: Use auto unless you know that your charger needs v1 or v2.
  goe_timeout_seconds:
    name: go-e wallbox - HTTP timeout in seconds
    description: How long the app waits for the wallbox to respond.
  goe_poll_interval_seconds:
    name: go-e wallbox - polling interval
    description: Reserved for go-e polling. OCPP telemetry uses the meter interval.
  ocpp_version:
    name: OCPP - version
    description: Only OCPP 1.6 JSON over WebSocket is currently supported.
  ocpp_backend_url:
    name: OCPP - WebSocket URL
    description: Full wss URL from your backend. The app uses this URL exactly as entered.
  ocpp_charge_point_id:
    name: OCPP - charge point ID
    description: Charge point name known by the backend. It often also appears in the WebSocket URL.
  ocpp_connector_id:
    name: OCPP - connector ID
    description: Usually 1 for a single go-e wallbox.
  ocpp_basic_auth_user:
    name: OCPP - basic auth user
    description: Only needed if your OCPP backend requires HTTP Basic Authentication.
  ocpp_basic_auth_password:
    name: OCPP - basic auth password
    description: Only needed if your OCPP backend requires HTTP Basic Authentication.
  bridge_dry_run:
    name: Safety - test mode without control commands
    description: When enabled, no start or stop commands are sent to the wallbox.
  bridge_read_only:
    name: Safety - read only
    description: When enabled, the app only sends status and meter values.
  bridge_allow_remote_start:
    name: Safety - allow RemoteStart
    description: Allows the OCPP backend to start charging. Dry run and read only must be disabled.
  bridge_allow_remote_stop:
    name: Safety - allow RemoteStop
    description: Allows the OCPP backend to stop charging. Dry run and read only must be disabled.
  bridge_heartbeat_interval_seconds:
    name: Bridge - heartbeat interval in seconds
    description: Fallback OCPP heartbeat interval if the backend does not provide one.
  bridge_meter_interval_seconds:
    name: Bridge - meter interval in seconds
    description: How often status and meter values are sent to the OCPP backend.
  bridge_reconnect_interval_seconds:
    name: Bridge - reconnect delay in seconds
    description: Delay before reconnecting after a broken backend connection.
  bridge_websocket_ping_interval_seconds:
    name: Bridge - WebSocket keepalive interval
    description: Technical WebSocket ping interval.
  bridge_websocket_ping_timeout_seconds:
    name: Bridge - WebSocket keepalive timeout
    description: Timeout for WebSocket pong responses.
  bridge_log_level:
    name: Logging - log level
    description: DEBUG is useful during setup, INFO is usually enough for normal operation.
  bridge_state_file:
    name: Files - state file
    description: Persistent bridge state file. Keep /data/state.json for normal use.
  bridge_log_file:
    name: Files - log file
    description: Optional container log file. Leave empty to use only the Home Assistant app log.
